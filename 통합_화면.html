<script>
(function(){
  var screens = JSON.parse(document.getElementById('screens').textContent);

  // 각 화면의 data-path 값(화면마다 표기가 조금씩 다름) -> 이동할 화면
  var routes = {
    'timeline-room':        'home',
    'crimeboard-analysis':  'crimeboard',
    'comparison-review':    'compare',
    'similar-comparison':   'compare',
    'similarity-comparison':'compare',
    'similarity-compare':   'compare',
    'panorama-review':      'panorama'
  };

  function show(key){
    Object.keys(screens).forEach(function(k){
      document.getElementById('f-'+k).classList.toggle('active', k === key);
    });
    try { document.getElementById('f-'+key).contentWindow.scrollTo(0,0); } catch(e){}
  }

  Object.keys(screens).forEach(function(key){
    var frame = document.getElementById('f-'+key);
    frame.addEventListener('load', function(){
      var doc = frame.contentDocument;
      if(!doc) return;
      doc.addEventListener('click', function(e){
        var a = e.target.closest && e.target.closest('a[data-path]');
        if(!a) return;
        var target = routes[a.getAttribute('data-path')];
        if(!target) return;
        e.preventDefault();
        show(target);
      }, true);
    });
    frame.srcdoc = screens[key];
  });
})();
</script>
